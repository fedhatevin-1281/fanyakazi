<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Fanyakazi</title><style>:root{color-scheme:dark;--bg:#050505;--panel:rgba(255,255,255,.08);--line:rgba(255,234,147,.2);--text:#FFEA93;--muted:rgba(255,234,147,.68);--red:#D90000}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Segoe UI,system-ui,sans-serif;color:var(--text);background:radial-gradient(700px 500px at 80% 0%,rgba(217,0,0,.3),transparent 65%),var(--bg)}.card{width:min(100%,390px);padding:30px 25px;border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 24px 70px #0008}.eyebrow{color:#8DB355;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{font-size:30px;margin:9px 0 25px}label{display:block;margin:14px 0 6px;color:var(--muted);font-size:12px}input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#0005;color:var(--text);font:inherit}button{width:100%;margin-top:22px;height:45px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--red),#8a0000);color:var(--text);font-weight:800;cursor:pointer}button:disabled{opacity:.6}#error{min-height:20px;margin:16px 0 0;color:#ff9b9b;font-size:13px}</style></head>
<body><main class="card"><div class="eyebrow">Fanyakazi operations</div><h1>Admin sign in</h1><form id="form"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Sign in securely</button><p id="error" role="alert"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../scripts/supabase-config.js"></script><script>(async function(){var config=window.FANYAKAZI_CONFIG;var client=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey);document.getElementById('form').addEventListener('submit',async function(event){event.preventDefault();var button=document.getElementById('submit');var error=document.getElementById('error');button.disabled=true;error.textContent='';var result=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(result.error){error.textContent='Admin sign in failed. Check your credentials.';button.disabled=false;return}var check=await fetch(config.apiBaseUrl+'/api/admin/overview',{headers:{Authorization:'Bearer '+result.data.session.access_token}});if(!check.ok){await client.auth.signOut();error.textContent='This account does not have administrator access.';button.disabled=false;return}window.location.href='./index.html';});})();</script></body></html>
