<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Hub | Fanyakazi</title><style>
:root{color-scheme:dark;--bg:#050505;--panel:#11100f;--panel2:#171513;--line:rgba(255,234,147,.17);--text:#FFEA93;--muted:rgba(255,234,147,.67);--red:#D90000;--olive:#8DB355}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(700px 500px at 100% 0%,rgba(217,0,0,.22),transparent 60%),var(--bg);color:var(--text);font:14px Segoe UI,system-ui,sans-serif}.app{display:flex;min-height:100vh}.side{width:260px;padding:24px 16px;border-right:1px solid var(--line);background:rgba(8,7,7,.9);transition:width .2s}.side.collapsed{width:76px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.8px;margin-bottom:38px;white-space:nowrap;overflow:hidden}.brand img{width:38px;height:38px;border-radius:12px;object-fit:cover}.side.collapsed .brand span,.side.collapsed .nav-label{display:none}.nav{display:grid;gap:8px}.nav button{width:100%;padding:12px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(217,0,0,.15);border-color:var(--line);color:var(--text)}.nav button b{display:inline-block;width:24px}.main{flex:1;padding:28px clamp(20px,4vw,54px);min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:42px}.top h1{margin:4px 0 0;font-size:clamp(28px,4vw,48px)}.eyebrow{color:var(--olive);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.icon-btn,.signout{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:rgba(255,255,255,.05);color:var(--text);cursor:pointer}.content{max-width:1100px}.wallet{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:28px}.stat{min-width:170px;padding:17px 19px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;margin-top:7px;font-size:25px}.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.job{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--panel);display:flex;flex-direction:column}.job img{width:100%;height:150px;object-fit:cover}.job-body{padding:18px;display:flex;flex-direction:column;min-height:190px}.job h2{font-size:19px;margin:7px 0}.job p{color:var(--muted);line-height:1.6;flex:1;margin:0 0 15px}.job a,.job button{display:inline-block;border:0;border-radius:9px;padding:11px 13px;background:linear-gradient(135deg,var(--red),#8a0000);color:var(--text);font-weight:800;text-align:center;cursor:pointer;text-decoration:none}.job.done{opacity:.7}.job.done button{background:var(--olive);color:#101500}.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.modal{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:#000b;z-index:4}.modal.open{display:grid}.dialog{width:min(100%,520px);padding:24px;border:1px solid var(--line);border-radius:17px;background:rgba(23,21,19,.96);box-shadow:0 24px 80px #000}.dialog h2{margin-top:0}.dialog textarea{width:100%;min-height:150px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0008;color:var(--text);font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.dialog button{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:var(--red);color:var(--text);cursor:pointer}.dialog .cancel{background:transparent}.notice{min-height:20px;color:var(--muted);margin-top:12px}@media(max-width:760px){.side{width:76px}.side .brand span,.side .nav-label{display:none}.main{padding:20px 14px}.top{align-items:flex-start}.top h1{font-size:30px}.jobs{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side" id="side"><a class="brand" href="../index.html"><img src="../images/Gemini_Generated_Image_ax4xpuax4xpuax4x-removebg-preview.png" alt="Fanyakazi"><span>FANYAKAZI</span></a><nav class="nav" id="nav"><button class="active" data-view="all"><b>⌂</b><span class="nav-label">All work</span></button></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">Member work hub</div><h1 id="heading">Available work</h1></div><div><button class="icon-btn" id="collapse" type="button">☰</button><button class="signout" id="signout" type="button">Sign out</button></div></div><section class="content"><div class="wallet"><div class="stat"><span>Available balance</span><b id="balance">KSh 0</b></div><div class="stat"><span>Lifetime earned</span><b id="earned">KSh 0</b></div></div><div class="jobs" id="jobs">Loading work...</div><p class="notice" id="notice"></p></section></main></div><div class="modal" id="reviewModal"><form class="dialog" id="reviewForm"><h2>Submit your hotel review</h2><p id="reviewTitle"></p><textarea id="reviewText" placeholder="Write your honest review..."></textarea><div class="dialog-actions"><button class="cancel" id="cancelReview" type="button">Cancel</button><button type="submit">Submit review</button></div><p class="notice" id="reviewNotice"></p></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../scripts/supabase-config.js"></script><script>
(async function(){var config=window.FANYAKAZI_CONFIG,client=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey),sessionResult=await client.auth.getSession(),session=sessionResult.data.session;if(!session){location.href='../pages/login.php.html';return}var jobs=document.getElementById('jobs'),notice=document.getElementById('notice'),modal=document.getElementById('reviewModal'),reviewJob=null,allJobs=[];document.getElementById('collapse').onclick=function(){document.getElementById('side').classList.toggle('collapsed')};document.getElementById('signout').onclick=async function(){await client.auth.signOut();location.href='../pages/login.php.html'};function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function render(filter){var submissions=data.submissions.reduce(function(map,item){map[item.job_id]=item;return map},{});var list=allJobs.filter(function(job){return filter==='all'||job.program_id===filter});if(!list.length){jobs.innerHTML='<div class="empty">No work is available for this program yet.</div>';return}jobs.innerHTML=list.map(function(job){var sub=submissions[job.id],body='<div class="job-body"><div class="eyebrow">'+esc(job.category==='hotel_review'?'Hotel review':'AI training')+'</div><h2>'+esc(job.title)+'</h2><p>'+esc(job.description)+'</p>';if(job.category==='ai_training')body+=job.external_url?'<a href="'+esc(job.external_url)+'" target="_blank" rel="noopener">Open work link</a>':'<span class="empty">Link unavailable</span>';else body+=sub?'<button class="done" disabled>Completed · KSh '+esc(sub.reward)+'</button>':'<button data-review="'+esc(job.id)+'">Write review · KSh '+esc(job.reward)+'</button>';return '<article class="job '+(sub?'done':'')+'">'+(job.image_url?'<img src="'+esc(job.image_url)+'" alt="">':'')+body+'</div></article>'}).join('');jobs.querySelectorAll('[data-review]').forEach(function(button){button.onclick=function(){reviewJob=allJobs.find(function(job){return job.id===button.dataset.review});document.getElementById('reviewTitle').textContent=reviewJob.title+' · Earn KSh '+reviewJob.reward;document.getElementById('reviewText').value='';document.getElementById('reviewNotice').textContent='';modal.classList.add('open')}})}var data={submissions:[]};var response=await fetch(config.apiBaseUrl+'/api/work/overview',{headers:{Authorization:'Bearer '+session.access_token}});data=await response.json();if(!response.ok){notice.textContent=data.error||'Unable to load work';return}allJobs=data.jobs;document.getElementById('balance').textContent='KSh '+Number(data.wallet.balance).toLocaleString();document.getElementById('earned').textContent='KSh '+Number(data.wallet.lifetime_earned).toLocaleString();data.programs.forEach(function(program){var button=document.createElement('button');button.dataset.view=program.id;button.innerHTML='<b>▸</b><span class="nav-label">'+esc(program.name)+'</span>';document.getElementById('nav').appendChild(button);button.onclick=function(){document.querySelectorAll('#nav button').forEach(function(item){item.classList.remove('active')});button.classList.add('active');document.getElementById('heading').textContent=program.name;render(program.id)}});render('all');document.getElementById('cancelReview').onclick=function(){modal.classList.remove('open')};document.getElementById('reviewForm').onsubmit=async function(event){event.preventDefault();if(!reviewJob)return;var text=document.getElementById('reviewText').value.trim();if(!text){document.getElementById('reviewNotice').textContent='Write a review first.';return}var result=await fetch(config.apiBaseUrl+'/api/work/reviews',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({jobId:reviewJob.id,reviewText:text})});var payload=await result.json();if(!result.ok){document.getElementById('reviewNotice').textContent=payload.error||'Unable to submit review';return}modal.classList.remove('open');notice.textContent='Review approved. You earned KSh '+payload.reward+'.';var refreshed=await fetch(config.apiBaseUrl+'/api/work/overview',{headers:{Authorization:'Bearer '+session.access_token}});data=await refreshed.json();allJobs=data.jobs;document.getElementById('balance').textContent='KSh '+Number(data.wallet.balance).toLocaleString();document.getElementById('earned').textContent='KSh '+Number(data.wallet.lifetime_earned).toLocaleString();render('all')};})();
</script></body></html>
